<!doctype html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SINAR PAGI MOTOR & SPAREPART</title>
<style>
:root{--navy:#0f2547;--or:#f57c1f;--bg:#eef1f5;--tx:#1b2333}
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--navy);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:15px}header small{opacity:.8}
nav{display:flex;gap:6px;padding:8px;overflow-x:auto;background:#fff;position:sticky;top:0;z-index:5}
nav button{flex:1;min-width:84px;padding:12px 8px;border:0;border-radius:10px;background:var(--bg);font-weight:600}
nav button.on{background:var(--or);color:#fff}
main{padding:10px;max-width:760px;margin:auto}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input,select{width:100%;padding:13px;border:1px solid #cdd3dd;border-radius:10px;font-size:16px;margin:4px 0}
.row input{flex:1;min-width:110px}
.btn{padding:14px 18px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-size:16px;font-weight:700}
.btn.or{background:var(--or)}.btn.gr{background:#6b7585}.btn:disabled{opacity:.5}
.item{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid #e6e9ef}
.muted{color:#6b7585;font-size:14px}.tot{font-size:24px;font-weight:800;color:var(--navy)}
.low{color:#c62828;font-weight:700}
video{width:100%;border-radius:12px;background:#000;max-height:260px;object-fit:cover}
.frame{position:relative}.frame:after{content:"";position:absolute;left:12%;right:12%;top:50%;border-top:2px solid var(--or);box-shadow:0 0 8px var(--or)}
#msg{position:fixed;left:10px;right:10px;bottom:10px;background:#222;color:#fff;padding:12px;border-radius:10px;display:none;z-index:9}
#struk{display:none}
@media print{body *{visibility:hidden}#struk,#struk *{visibility:visible}#struk{display:block;position:absolute;left:0;top:0;width:58mm;font:12px monospace}}
</style></head><body>
<div id="app"></div><div id="msg"></div><div id="struk"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>
<script>
// ====== ISI DUA BARIS INI (dari Supabase > Project Settings > API) ======
const SUPABASE_URL = "https://icfsaaehvrrezgoejrwd.supabase.co";
const SUPABASE_KEY = "sb_publishable_LQFd2X8-21kerNu1zPSJAg_TSJuAF0n";
// =========================================================================
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp = n => 'Rp ' + Number(n || 0).toLocaleString('id-ID');
const wib = d => new Date(d).toLocaleString('id-ID', {timeZone:'Asia/Jakarta'});
let me = null, cart = [], idem = crypto.randomUUID(), ctl = null, track = null, P = {}, lastScan = {c:'',t:0};
const isAdmin = () => me && (me.role === 'owner' || me.role === 'admin');

function msg(t) { const m = $('#msg'); m.textContent = t; m.style.display = 'block'; clearTimeout(msg.t); msg.t = setTimeout(() => m.style.display = 'none', 4000); }

function shell(html, tab) {
  const tabs = [['kasir','🛒 Kasir'],['barang','📦 Barang'],['scan','📷 Uji Scan'],['riwayat','🧾 Riwayat']];
  $('#app').innerHTML = `<header><div><b>SINAR PAGI MOTOR & SPAREPART</b><br><small>${esc(me.full_name)} · ${me.role}</small></div>
  <button class="btn gr" onclick="logout()">Keluar</button></header>
  <nav>${tabs.map(t => `<button class="${t[0]===tab?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')}</nav>
  <main>${html}</main>`;
}
async function logout() { stopScan(); await sb.auth.signOut(); loginView(); }

// ---------- LOGIN ----------
function loginView() {
  $('#app').innerHTML = `<main style="margin-top:8vh"><div class="card" style="text-align:center">
  <h2 style="color:var(--navy);margin:0">SINAR PAGI</h2><b style="color:var(--or)">MOTOR & SPAREPART</b>
  <p class="muted">Masuk dengan akun Anda</p>
  <input id="em" type="email" placeholder="Email" autocomplete="username">
  <input id="pw" type="password" placeholder="Kata sandi" autocomplete="current-password">
  <button class="btn or" style="width:100%;margin-top:8px" onclick="login()">MASUK</button></div></main>`;
}
async function login() {
  const { error } = await sb.auth.signInWithPassword({ email: $('#em').value.trim(), password: $('#pw').value });
  if (error) return msg('Login gagal: email atau kata sandi salah');
  boot();
}
async function boot() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return loginView();
  const { data } = await sb.from('profiles').select('*').eq('id', user.id).single();
  me = data;
  if (!me || !me.active) { await sb.auth.signOut(); loginView(); return msg('Akun belum aktif. Minta Owner mengaktifkannya.'); }
  sb.rpc('log_activity', { p_action: 'login', p_detail: {} });
  go('kasir');
}
function go(t) { stopScan(); ({ kasir: kasirView, barang: barangView, scan: scanView, riwayat: riwayatView })[t](); }

// ---------- SCANNER ----------
function scanBox(mode) {
  return `<div id="scanbox"><div class="frame"><video id="vid" playsinline muted></video></div>
  <div class="row" style="margin:8px 0"><button class="btn gr" onclick="stopScan();$('#scanbox').innerHTML=''">Hentikan</button>
  <button class="btn" onclick="flash()">🔦 Lampu</button>
  <label><input type="checkbox" id="rep" style="width:auto"> Scan berulang</label></div>
  <div class="row"><input id="man" placeholder="Ketik kode manual"><button class="btn or" onclick="onCode('${mode}',$('#man').value.trim())">Cari</button></div></div>`;
}
async function startScan(mode) {
  stopScan(); $('#scanbox').outerHTML = '<div id="scanbox"></div>'; $('#scanbox').innerHTML = scanBox(mode);
  try {
    const reader = new ZXingBrowser.BrowserMultiFormatReader();
    ctl = await reader.decodeFromConstraints({ video: { facingMode: { ideal: 'environment' } } }, $('#vid'), (res) => {
      if (!res) return;
      const c = res.getText(), now = Date.now();
      if (c === lastScan.c && now - lastScan.t < 2500) return; // cegah scan ganda
      lastScan = { c, t: now };
      if (!$('#rep') || !$('#rep').checked) { stopScan(); }
      onCode(mode, c);
    });
    track = $('#vid').srcObject?.getVideoTracks?.()[0];
  } catch (e) {
    msg(e.name === 'NotAllowedError' ? 'Izin kamera ditolak. Aktifkan izin kamera di pengaturan browser, atau ketik kode manual.' : 'Kamera tidak tersedia. Gunakan input manual.');
    $('#scanbox').innerHTML = `<div class="row"><input id="man" placeholder="Ketik kode manual"><button class="btn or" onclick="onCode('${mode}',$('#man').value.trim())">Cari</button></div>`;
  }
}
function stopScan() { try { ctl && ctl.stop(); } catch (e) {} ctl = null; track = null; }
async function flash() {
  try { const cap = track.getCapabilities(); if (!cap.torch) return msg('Lampu tidak didukung perangkat ini');
    flash.on = !flash.on; await track.applyConstraints({ advanced: [{ torch: flash.on }] }); } catch (e) { msg('Lampu tidak didukung'); }
}
async function onCode(mode, code) {
  if (!code) return;
  const { data, error } = await sb.rpc('find_product_by_code', { p_code: code });
  if (error) return msg(error.message);
  const p = data && data[0];
  if (mode === 'kasir') {
    if (!p) return msg('Barcode ' + code + ' belum terdaftar' + (isAdmin() ? '. Daftarkan di menu Barang.' : '.'));
    P[p.id] = p; addCart(p.id); msg('Ditambah: ' + p.name);
  } else {
    $('#hasil').innerHTML = p
      ? `<div class="card"><b>✅ Terbaca: ${esc(code)}</b><br>${esc(p.name)}<br>Stok ${p.stock} · Jual ${rp(p.sell_price)} · Modal ${rp(p.cost_price)}</div>`
      : `<div class="card"><b>Terbaca: ${esc(code)}</b><br>Belum terdaftar di database.${isAdmin() ? `<br><button class="btn or" onclick="newWith('${esc(code)}')">Buat barang baru</button>` : ''}</div>`;
  }
}
function scanView() {
  shell(`<div class="card"><h3>Uji Scanner</h3><p class="muted">Arahkan kamera belakang ke barcode asli. Bila terbaca, kodenya tampil di bawah.</p>
  <button class="btn or" onclick="startScan('test')">▶ Mulai scan</button><div id="scanbox"></div></div><div id="hasil"></div>`, 'scan');
}

// ---------- KASIR ----------
function kasirView() {
  shell(`<div class="card"><div class="row"><button class="btn or" onclick="startScan('kasir')">📷 Scan</button>
  <input id="q" placeholder="Cari nama / SKU / merek" oninput="search(this.value)"></div>
  <div id="scanbox"></div><div id="res"></div></div>
  <div class="card"><h3 style="margin-top:0">Keranjang</h3><div id="cart"></div></div>`, 'kasir');
  drawCart();
}
let st; function search(q) { clearTimeout(st); st = setTimeout(async () => {
  q = q.replace(/[,()%]/g, ' ').trim(); if (q.length < 2) return $('#res').innerHTML = '';
  const { data } = await sb.from('products').select('*').eq('active', true)
    .or(`name.ilike.%${q}%,sku.ilike.%${q}%,brand.ilike.%${q}%,barcode_factory.eq.${q},barcode_internal.eq.${q}`).limit(10);
  (data || []).forEach(p => P[p.id] = p);
  $('#res').innerHTML = (data || []).map(p => `<div class="item"><div><b>${esc(p.name)}</b><br><span class="muted">${esc(p.brand || '')} · stok <span class="${p.stock <= p.min_stock ? 'low' : ''}">${p.stock}</span> · ${rp(p.sell_price)}</span></div>
  <button class="btn or" onclick="addCart('${p.id}')" ${p.stock < 1 ? 'disabled' : ''}>+</button></div>`).join('') || '<p class="muted">Tidak ditemukan</p>';
}, 250); }
function addCart(id) {
  const p = P[id], l = cart.find(x => x.id === id);
  if (l) { if (l.qty < p.stock) l.qty++; else msg('Stok tidak cukup'); }
  else if (p.stock < 1) msg('Stok habis'); else cart.push({ id, name: p.name, price: Number(p.sell_price), qty: 1, disc: 0 });
  drawCart();
}
const lineTot = l => Math.max(l.price * l.qty - l.disc, 0);
const cartTot = () => cart.reduce((s, l) => s + lineTot(l), 0);
function drawCart() {
  const el = $('#cart'); if (!el) return;
  if (!cart.length) return el.innerHTML = '<p class="muted">Kosong. Scan atau cari barang.</p>';
  el.innerHTML = cart.map((l, i) => `<div class="item"><div style="flex:1"><b>${esc(l.name)}</b><br><span class="muted">${rp(l.price)} × ${l.qty}</span>
  <input type="number" inputmode="numeric" placeholder="Diskon Rp" value="${l.disc || ''}" onchange="cart[${i}].disc=Math.max(+this.value||0,0);drawCart()"></div>
  <div style="text-align:right"><b>${rp(lineTot(l))}</b><div class="row" style="justify-content:flex-end">
  <button class="btn gr" onclick="qty(${i},-1)">−</button><button class="btn" onclick="qty(${i},1)">+</button></div></div></div>`).join('') +
  `<p class="tot">Total: ${rp(cartTot())}</p>
  <select id="mt"><option value="tunai">Tunai</option><option value="transfer">Transfer bank</option><option value="qris">QRIS</option></select>
  <input id="paid" type="number" inputmode="numeric" placeholder="Uang diterima (kosong = pas)" oninput="kembali()">
  <p id="kmb" class="muted"></p><button id="pay" class="btn or" style="width:100%" onclick="bayar()">BAYAR</button>`;
}
function kembali() { const v = +$('#paid').value || 0; $('#kmb').textContent = v ? (v >= cartTot() ? 'Kembalian: ' + rp(v - cartTot()) : 'Kurang: ' + rp(cartTot() - v)) : ''; }
function qty(i, d) { const l = cart[i], p = P[l.id]; l.qty += d;
  if (l.qty < 1) cart.splice(i, 1); else if (l.qty > p.stock) { l.qty = p.stock; msg('Stok tidak cukup'); } drawCart(); }
async function bayar() {
  const b = $('#pay'); if (b.disabled) return; b.disabled = true; b.textContent = 'Memproses...';
  const total = cartTot(), paid = +$('#paid').value || total;
  const { data, error } = await sb.rpc('create_sale', { p_idem: idem, p_customer: null,
    p_items: cart.map(l => ({ product_id: l.id, qty: l.qty, price: l.price, discount: l.disc })),
    p_discount: 0, p_payments: [{ method: $('#mt').value, amount: paid }], p_note: null });
  if (error) { b.disabled = false; b.textContent = 'BAYAR'; return msg(error.message); }
  const { data: s } = await sb.from('sales').select('*, sale_items(*)').eq('id', data).single();
  struk(s); cart = []; idem = crypto.randomUUID(); P = {}; kasirView();
  msg('Transaksi berhasil: ' + s.invoice_no);
}
function struk(s) {
  $('#struk').innerHTML = `<b>SINAR PAGI MOTOR & SPAREPART</b><br>${s.invoice_no}<br>${wib(s.created_at)}<hr>` +
    s.sale_items.map(i => `${esc(i.name)}<br>${i.qty} x ${rp(i.price)} = ${rp(i.line_total)}`).join('<br>') +
    `<hr>TOTAL ${rp(s.total)}<br>Bayar ${rp(s.paid)}<br>Kembali ${rp(s.change_amount)}<br><br>Terima kasih`;
}

// ---------- BARANG ----------
async function barangView(prefill) {
  shell(`${isAdmin() ? `<div class="card"><h3 style="margin-top:0">Tambah barang</h3>
  <input id="n" placeholder="Nama barang"><div class="row"><input id="br" placeholder="Merek"><input id="rk" placeholder="Rak"></div>
  <div class="row"><input id="hm" type="number" inputmode="numeric" placeholder="Harga modal"><input id="hj" type="number" inputmode="numeric" placeholder="Harga jual"></div>
  <div class="row"><input id="sk" type="number" inputmode="numeric" placeholder="Stok awal"><input id="ms" type="number" inputmode="numeric" placeholder="Stok minimum"></div>
  <input id="bf" placeholder="Barcode pabrik (kosongkan jika tidak ada)" value="${esc(prefill || '')}">
  <p class="muted">Barcode internal SP-000001 dibuat otomatis.</p>
  <button class="btn or" style="width:100%" onclick="simpan()">SIMPAN</button></div>` : ''}
  <div class="card"><input id="fq" placeholder="Cari barang..." oninput="listBarang(this.value)"><div id="lst"></div></div>`, 'barang');
  listBarang('');
}
function newWith(c) { barangView(c); }
async function listBarang(q) {
  q = (q || '').replace(/[,()%]/g, ' ').trim();
  let r = sb.from('products').select('*').eq('active', true).order('name').limit(50);
  if (q) r = r.or(`name.ilike.%${q}%,sku.ilike.%${q}%,brand.ilike.%${q}%,barcode_factory.eq.${q},barcode_internal.eq.${q}`);
  const { data, error } = await r; if (error) return msg(error.message);
  $('#lst').innerHTML = data.map(p => `<div class="item"><div><b>${esc(p.name)}</b><br><span class="muted">${esc(p.barcode_internal)} · ${esc(p.brand || '')} · rak ${esc(p.shelf || '-')}</span></div>
  <div style="text-align:right">${rp(p.sell_price)}<br><span class="${p.stock <= p.min_stock ? 'low' : 'muted'}">stok ${p.stock}${p.stock <= p.min_stock ? ' ⚠' : ''}</span></div></div>`).join('') || '<p class="muted">Belum ada barang</p>';
}
async function simpan() {
  const v = id => $(id).value.trim();
  if (!v('#n')) return msg('Nama barang wajib diisi');
  const { error } = await sb.from('products').insert({ name: v('#n'), brand: v('#br') || null, shelf: v('#rk') || null,
    cost_price: +v('#hm') || 0, sell_price: +v('#hj') || 0, stock: +v('#sk') || 0, min_stock: +v('#ms') || 0, barcode_factory: v('#bf') || null });
  if (error) return msg(error.code === '23505' ? 'Barcode sudah dipakai barang lain' : error.message);
  msg('Barang tersimpan'); barangView();
}

// ---------- RIWAYAT ----------
async function riwayatView() {
  shell('<div class="card"><div id="rw">Memuat...</div></div>', 'riwayat');
  const { data, error } = await sb.from('sales').select('*, profiles:cashier_id(full_name)').order('created_at', { ascending: false }).limit(50);
  if (error) return msg(error.message);
  $('#rw').innerHTML = data.map(s => `<div class="item"><div><b>${s.invoice_no}</b> ${s.status === 'batal' ? '<span class="low">BATAL</span>' : ''}<br>
  <span class="muted">${wib(s.created_at)} · ${esc(s.profiles?.full_name || '')}</span></div>
  <div style="text-align:right"><b>${rp(s.total)}</b><br>${isAdmin() && s.status !== 'batal' ? `<button class="btn gr" onclick="batal('${s.id}')">Batalkan</button>` : ''}</div></div>`).join('') || '<p class="muted">Belum ada transaksi</p>';
}
async function batal(id) {
  const r = prompt('Alasan pembatalan:'); if (!r) return;
  const { error } = await sb.rpc('void_sale', { p_sale: id, p_reason: r });
  if (error) return msg(error.message); msg('Transaksi dibatalkan'); riwayatView();
}

if (SUPABASE_URL.startsWith('ISI_')) $('#app').innerHTML = '<main><div class="card"><h3>Belum dikonfigurasi</h3>Isi SUPABASE_URL dan SUPABASE_KEY di file index.html.</div></main>';
else boot();
</script></body></html>
